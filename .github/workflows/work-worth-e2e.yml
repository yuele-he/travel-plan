name: Work Worth browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'work-worth-test/**'
      - '.github/workflows/work-worth-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          URL="https://yuele-he.github.io/travel-plan/work-worth-test/?ci=$GITHUB_RUN_ID"
          ok=0
          for i in $(seq 1 40); do
            body=$(curl -fsSL "$URL" || true)
            if printf '%s' "$body" | grep -q 'app-v3-api.html?v=10'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run desktop and mobile flows
        shell: bash
        run: |
          cat > .work-worth-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const URL='https://yuele-he.github.io/travel-plan/work-worth-test/?e2e='+Date.now();
          const browser=await chromium.launch();

          async function answerCurrent(page, optionIndex=0){
            const before=(await page.locator('#questionCard .q-title').innerText()).trim();
            const isMulti=await page.locator('#questionCard .multi-note').count()>0;
            const option=page.locator('#questionCard .option').nth(optionIndex);
            await option.waitFor({state:'visible'});
            await option.click();

            if(isMulti){
              await page.waitForTimeout(380);
              if(await page.locator('#result:not(.hidden)').count()) return;
              const after=(await page.locator('#questionCard .q-title').innerText()).trim();
              if(after===before){
                const next=page.locator('#nextBtn');
                await next.waitFor({state:'visible'});
                assert.ok((await next.innerText()).includes('继续')||(await next.innerText()).includes('结果'),'multi-select CTA');
                console.log('MULTI before click',before,'disabled=',await next.isDisabled(),'selected=',await page.locator('#questionCard .option.selected').count());
                await next.click();
                await page.waitForTimeout(250);
                const afterNext=await page.locator('#result:not(.hidden)').count()
                  ? 'RESULT'
                  : (await page.locator('#questionCard .q-title').innerText()).trim();
                console.log('MULTI',before,'->',afterNext);
                assert.notEqual(afterNext,before,'multi-select continue from '+before);
              }
            }else{
              await page.waitForTimeout(700);
              const after=await page.locator('#result:not(.hidden)').count()
                ? 'RESULT'
                : (await page.locator('#progressLabel').innerText()).trim();
              const selected=await page.locator('#questionCard .option.selected').count();
              console.log('AUTO',before,'->',after,'selected=',selected);
              assert.notEqual(after,before,'single-select auto-advance from '+before);
            }
          }

          async function completeFlow(viewport,label){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            await page.goto(URL,{waitUntil:'networkidle'});
            await page.click('#startBtn');

            if(label==='mobile'){
              const firstBox=await page.locator('#questionCard .option').first().boundingBox();
              assert.ok(firstBox&&firstBox.height>=52,'mobile option touch height');
              assert.equal(await page.locator('.quiz-actions:not(.hidden)').count(),0,'single-select has no extra next button');
            }

            let multiSeen=0,waitingHorizonSeen=false;
            for(let i=0;i<45;i++){
              if(await page.locator('#result:not(.hidden)').count()) break;
              if(await page.locator('#questionCard .multi-note').count()) multiSeen++;
              const currentTitle=(await page.locator('#questionCard .q-title').innerText()).trim();
              if(currentTitle.includes('距离现在大约还有多久')) waitingHorizonSeen=true;
              await answerCurrent(page,0);
            }

            await page.locator('#result:not(.hidden)').waitFor({state:'visible',timeout:20000});
            await page.locator('.score-card').first().waitFor({state:'visible',timeout:20000});
            assert.equal(await page.locator('.score-card').count(),4,label+' score cards');
            assert.ok((await page.locator('.stage-title').innerText()).trim().length>0,label+' stage title');
            assert.equal((await page.locator('.stage-title').innerText()).trim(),'先处理现实风险',label+' high-risk hero priority');
            if(label==='mobile'){
              await page.locator('#shareCardBtn').click();
              await page.locator('#shareModal:not(.hidden)').waitFor({state:'visible',timeout:10000});
              const src=await page.locator('#sharePreview').getAttribute('src');
              assert.ok(src&&src.startsWith('blob:'),'share image generated');
              const natural=await page.locator('#sharePreview').evaluate(img=>({w:img.naturalWidth,h:img.naturalHeight}));
              assert.equal(natural.w,900,'share image width');
              assert.equal(natural.h,1200,'share image height');
              assert.equal(await page.locator('script[data-qrcode-lib]').count(),0,'share card loads no QR library');
              const source=await page.content();
              assert.ok(!source.includes('扫码测测你的工作')&&!source.includes('QRCode')&&!source.includes('SHARE_URL')&&!source.includes('二维码和网址'),'share card has no QR or test CTA');
              await page.locator('#shareCloseBtn').click();
            }
            assert.ok(multiSeen>=2,label+' encountered multi-select questions');
            assert.ok(waitingHorizonSeen,label+' encountered waiting horizon question');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            assert.ok(overflow<=2,label+' horizontal overflow '+overflow);
            await context.close();
          }

          async function resumeAndEditFlow(){
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto(URL,{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle'});
            await page.click('#startBtn');

            await answerCurrent(page,0);
            await answerCurrent(page,0);

            await page.reload({waitUntil:'networkidle'});
            await page.locator('#resumeBtn:not(.hidden)').waitFor({state:'visible'});
            await page.click('#resumeBtn');
            assert.ok((await page.locator('#progressLabel').innerText()).startsWith('3 /'),'resume at q3');

            await answerCurrent(page,0);
            await answerCurrent(page,0);
            await page.click('#backBtn');
            await page.click('#backBtn');

            const before=(await page.locator('#questionCard .q-title').innerText()).trim();
            await page.locator('#questionCard .option').nth(1).click();
            await page.waitForFunction(
              old=>(document.querySelector('#questionCard .q-title')?.textContent||'').trim()!==old,
              before,
              {timeout:3000}
            );
            assert.equal(await page.locator('#questionCard .option.selected').count(),0,'downstream q4 answer cleared after q3 edit');
            await context.close();
          }

          async function multiSelectScrollFlow(){
            const context=await browser.newContext({viewport:{width:390,height:700}});
            const page=await context.newPage();
            await page.goto(URL,{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle'});
            await page.click('#startBtn');

            for(let i=0;i<35;i++){
              const title=(await page.locator('#questionCard .q-title').innerText()).trim();
              if(title.includes('下面哪些现实条件会限制你换工作')) break;
              await answerCurrent(page,0);
            }

            const title=(await page.locator('#questionCard .q-title').innerText()).trim();
            assert.ok(title.includes('下面哪些现实条件会限制你换工作'),'reached q21 multi-select');

            await page.locator('#questionCard .option').nth(0).click();
            await page.waitForTimeout(120);
            await page.locator('#questionCard .option').nth(1).click();
            await page.waitForTimeout(120);

            await page.evaluate(()=>window.scrollTo(0,Math.min(360,Math.max(0,document.documentElement.scrollHeight-window.innerHeight))));
            await page.waitForTimeout(100);
            const before=await page.evaluate(()=>window.scrollY);
            assert.ok(before>40,'mobile page scrolled before deselect');

            await page.locator('#questionCard .option').nth(1).click();
            await page.waitForTimeout(180);
            const after=await page.evaluate(()=>window.scrollY);
            assert.ok(Math.abs(after-before)<=8,'deselecting multi option preserves scroll: '+before+' -> '+after);

            await context.close();
          }

          await completeFlow({width:1280,height:800},'desktop');
          await completeFlow({width:390,height:844},'mobile');
          await resumeAndEditFlow();
          await multiSelectScrollFlow();
          await browser.close();
          console.log('ok: mobile auto-advance + multi-select CTA + scroll preserve + desktop/mobile + resume/edit reset');
          EOF
          node .work-worth-e2e.mjs
