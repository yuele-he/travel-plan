name: Verify travel persona build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct bundled sources like the browser
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';

          const read = p => fs.readFileSync(p, 'utf8').trim();
          const joined = paths => paths.map(read).join('');
          const decode = s => Buffer.from(atob(s), 'latin1');
          const writeB64 = (out, paths) => fs.writeFileSync(out, decode(joined(paths)));
          const writeGzipB64 = (out, paths) => fs.writeFileSync(out, zlib.gunzipSync(decode(joined(paths))));

          writeB64('/tmp/app.mjs', ['src/_parts/app.1.b64','src/_parts/app.2.b64','src/_parts/app.3.b64']);
          writeGzipB64('/tmp/data.mjs', ['src/_parts/data.gz.1.b64','src/_parts/data.gz.2.b64','src/_parts/data.gz.3.b64']);
          writeGzipB64('/tmp/zh-CN.mjs', ['src/_parts/locale-zh-CN.gz.b64']);
          writeGzipB64('/tmp/en.mjs', ['src/_parts/locale-en.gz.1.b64','src/_parts/locale-en.gz.2.b64','src/_parts/locale-en.gz.3.b64']);
          writeGzipB64('/tmp/zh-Hant.mjs', ['src/_parts/locale-zh-Hant7.1.b64','src/_parts/locale-zh-Hant7.2.b64','src/_parts/locale-zh-Hant7.3.b64']);
          console.log('Bundled sources reconstructed successfully');
          NODE
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/app.mjs
          node --check /tmp/data.mjs
          node --check /tmp/zh-CN.mjs
          node --check /tmp/zh-Hant.mjs
          node --check /tmp/en.mjs
          node --check src/app.js
          node --check src/data.js
          node --check src/load-parts.js
          node --check src/load-gzip-module.js
          node --check src/load-gzip-parts.js
          node --check src/locales/index.js
          node --check src/locales/zh-CN.js
          node --check src/locales/zh-Hant.js
          node --check src/locales/en.js
      - name: Product data smoke test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const dataMod = await import('file:///tmp/data.mjs');
          const d = dataMod.DATA;
          if (!d) throw new Error('DATA export missing');
          if (d.core?.length !== 12) throw new Error(`Expected 12 core questions, got ${d.core?.length}`);
          if (!Array.isArray(d.personas) || d.personas.length !== 17) throw new Error(`Expected 17 personas, got ${d.personas?.length}`);
          if (!Array.isArray(d.eggs) || d.eggs.length < 3) throw new Error('Easter egg pool missing');
          for (const file of ['zh-CN','zh-Hant','en']) {
            const mod = await import(`file:///tmp/${file}.mjs`);
            const obj = mod.default;
            const n = Object.keys(obj || {}).length;
            if (n < 450) throw new Error(`${file} locale too small: ${n} keys`);
            console.log(`${file}: ${n} locale keys`);
          }
          console.log(`personas=${d.personas.length}, core=${d.core.length}, branches=${d.branches?.length}, eggs=${d.eggs.length}`);
          NODE
