name: One-time purge work-worth history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-work-worth-history.yml'

permissions:
  contents: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Run one-time work-worth history cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve current clean frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/work-worth-clean
          cp work-worth-test/index.html /tmp/work-worth-clean/index.html
          cp work-worth-test/app-v3-api.html /tmp/work-worth-clean/app-v3-api.html

      - name: Rewrite history and restore clean frontend
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python -m pip install --user git-filter-repo
          export PATH="$HOME/.local/bin:$PATH"

          git filter-repo --force --path work-worth-test --invert-paths

          mkdir -p work-worth-test
          cp /tmp/work-worth-clean/index.html work-worth-test/index.html
          cp /tmp/work-worth-clean/app-v3-api.html work-worth-test/app-v3-api.html
          git add work-worth-test
          git commit -m "Restore clean API-backed work-worth frontend"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" HEAD:main --force
          git push "$REMOTE" --force --tags
