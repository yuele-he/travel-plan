<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf9f6">
  <title>重庆旅行计划 · 旅行需求</title>
  <style>
/* Design tokens — one scale across the entire questionnaire. */
:root {
  --page-width:680px; --gutter:clamp(16px,4vw,24px);
  --bg:#faf9f6; --paper:#fff; --ink:#292d2b; --muted:#6a716c;
  --line:#dedfd9; --accent:#356453; --selected:#edf3ee; --disabled:#e9ebe6;
  --radius:8px; --input-height:48px; --button-height:48px;
  --text-sm:13px; --text-base:16px; --text-title:clamp(24px,5.5vw,28px);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:40px;
}
*{box-sizing:border-box;min-width:0}
html{color:var(--ink);background:var(--bg);scroll-padding-bottom:100px}
body{margin:0;font:var(--text-base)/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;background:var(--disabled);color:#797f79;border-color:var(--disabled)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.smallUpload:focus-within{outline:2px solid var(--accent);outline-offset:3px}
button{font-weight:500}b,strong{font-weight:600}
.app{max-width:var(--page-width);margin:auto;padding:0 max(var(--gutter),env(safe-area-inset-right)) 0 max(var(--gutter),env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* PageHeader, CategoryNavigation, QuestionNavigation */
.pageHeader{padding-top:max(12px,env(safe-area-inset-top))}
.brandRow,.reviewHead,.uploadGroupTitle{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.logo{font-size:17px;font-weight:650;letter-spacing:.04em}
.brandRow{min-height:36px;align-items:flex-start;flex-wrap:wrap}
.logo{flex:1;min-width:130px;padding-top:8px}
.headerTools{display:flex;flex-direction:column;align-items:flex-end}
.languageNav{display:flex;gap:2px}
.languageNav button{min-width:44px;min-height:44px;padding:8px 6px;border:0;background:transparent;color:var(--muted);font-size:13px;border-radius:var(--radius)}
.languageNav button[aria-pressed="true"]{color:var(--accent);background:var(--selected)}
.saveStatus{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-shrink:0}
.saveStatus button{min-height:44px;min-width:44px;border:0;background:transparent;color:var(--accent);font-size:13px}
[hidden]{display:none!important}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bar{height:3px;background:var(--line);margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.stageNav,.qitemsWrap{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.stageNav::-webkit-scrollbar,.qitemsWrap::-webkit-scrollbar{display:none}
.stageNav{gap:20px;margin-top:4px;border-bottom:1px solid var(--line)}
.stageJump{flex:0 0 auto;min-height:44px;min-width:44px;padding:8px 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:14px}
.stageJump.current{color:var(--accent);border-bottom-color:var(--accent)}
.qitemsWrap{gap:4px;padding:4px 0}
.qjump{flex:0 0 auto;min-height:44px;display:flex;align-items:center;gap:5px;padding:8px 10px;border:0;background:transparent;color:var(--muted);font-size:13px;border-radius:var(--radius)}
.qjump.current{color:var(--accent);background:var(--selected)}
.qjumpDone{width:10px;font-size:11px;color:var(--accent)}
/* QuestionTitle, HelperText, SubQuestion */
.mission{flex:1;padding:20px 0 var(--space-6);overflow-wrap:anywhere}
.num{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.qtitle{font-size:var(--text-title);font-weight:650;line-height:1.45;letter-spacing:-.03em;margin:12px 0 0;outline:none}
.qhelp,.subhelp,.infoLine,.privacy,.sectionHint,.doneText{color:var(--muted);font-size:var(--text-sm);line-height:1.75;margin:10px 0 0}
.answerArea{margin-top:var(--space-5)}
.subblock,.familyPanel{margin-top:var(--space-5);padding-top:var(--space-5);border-top:1px solid var(--line)}
.subblock:first-child{margin-top:0;padding-top:0;border:0}
.subhead{font-weight:600;font-size:16px;line-height:1.65;margin-bottom:8px}
.infoLine{margin-top:var(--space-4)}
/* SingleChoiceCard, MultiChoiceCard, compact choices */
.options{display:grid;gap:var(--space-2);margin-top:var(--space-4)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}
.opttext{flex:1}.opttext b{font-size:16px;font-weight:500}.opttext small{display:block;font-size:var(--text-sm);color:var(--muted);margin-top:3px}
.radio,.check,.singleChoice::before,.multiChoice::before{width:18px;height:18px;flex:0 0 18px;border:1px solid #a5afa7;display:inline-grid;place-items:center;background:var(--paper)}
.radio,.singleChoice::before{border-radius:50%}.check,.multiChoice::before{border-radius:3px;font-size:12px;line-height:1}
.sel .radio,.singleChoice.sel::before{border:5px solid var(--accent)}
.sel .check,.multiChoice.sel::before{background:var(--accent);color:white;border-color:var(--accent)}
.chip,.inlineChoice,.cityBtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);font-size:16px;text-align:left}
.singleChoice::before,.multiChoice::before{content:"";width:16px;height:16px;flex-basis:16px}
.multiChoice.sel::before{content:"✓"}
.opt.sel,.chip.sel,.inlineChoice.sel,.cityBtn.sel{background:var(--selected);border-color:var(--accent)}
.chips,.inlineChoices,.cityHot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* TextInput, TextArea */
.field{margin-top:var(--space-5)}
.label{display:block;color:var(--muted);font-size:var(--text-sm);margin-bottom:8px}
.input,.area,.citySearch{width:100%;max-width:100%;min-height:var(--input-height);padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);font-size:16px;line-height:1.6}
.area{resize:vertical;min-height:96px}.compactArea{min-height:96px}
.cityHotTitle,.cityAlphaTitle{margin:24px 0 10px;font-size:var(--text-sm);color:var(--muted)}
.citySection{margin-top:20px}.citySection h4{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 8px}
.cityGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.currentCity{font-size:13px;color:var(--muted);margin-top:20px}
.customCityBtn{background:var(--selected);border:1px solid var(--accent);border-radius:var(--radius);min-height:48px;padding:10px 12px;width:100%;margin-top:12px}
/* DateRangePicker */
.calHead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.calHead button{width:44px;height:44px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);font-size:24px}
.calendar{margin-top:16px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.week span{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}
.day{height:44px;padding:0;border:0;border-radius:4px;background:transparent;font-size:16px}
.day.inrange{background:var(--selected)}.day.sel{background:var(--accent);color:white}
.rangeText{font-size:13px;line-height:1.8;padding:14px 0;margin-top:16px;border-top:1px solid var(--line)}
/* UploadSection */
.uploadGroup{padding-top:24px;margin-top:24px;border-top:1px solid var(--line)}
.uploadGroupTitle{align-items:baseline;flex-wrap:wrap;margin-bottom:12px}.uploadGroupTitle span{font-size:12px;color:var(--muted)}
.smallUpload{display:inline-flex;position:relative;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--selected);color:var(--accent);font-size:16px;cursor:pointer}
.fileInput{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.files{display:grid;gap:8px;margin-top:12px}.files:empty{display:none}
.fileRow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 10px;border-radius:var(--radius);background:var(--paper)}
.fileMeta{flex:1}.fileMeta b{font-size:13px;display:block;overflow-wrap:anywhere}.fileMeta small{font-size:12px;color:var(--muted)}
.remove,.editLink,.fixBtn{flex-shrink:0;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;color:var(--accent);font-size:13px}
/* RatingRow: wrapping keeps all five targets comfortably tappable. */
.starsRow{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.starsRow b{font-size:14px}.stars{display:flex;gap:2px}.star{width:44px;height:44px;border:0;background:transparent;color:#b9c0b9;font-size:29px;line-height:1}.star.on{color:var(--accent)}
/* BottomNavigation stays in normal flow: keyboard and long pages cannot be covered. */
.bottom{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;padding:16px 0 calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.nav,.primary,.secondary{min-height:var(--button-height);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--line);font-size:16px;font-weight:600}
.back,.secondary{background:var(--paper);color:var(--ink)}
.next,.primary{background:var(--accent);border-color:var(--accent);color:white}
.primary,.secondary{width:100%;margin-top:12px}
/* ReviewSection, MissingItem, SuccessState */
.review{display:grid;gap:24px}.reviewSec{border-bottom:1px solid var(--line);padding-bottom:20px}
.reviewSec h3{font-size:16px;margin:0}.row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:8px 0;font-size:14px}
.row span{flex:0 1 38%;color:var(--muted)}.row b{flex:1;text-align:right;font-weight:500;overflow-wrap:anywhere}
.reviewTitle{font-size:14px;line-height:1.9;color:var(--muted);margin-top:8px}
.submitLock,.issue{font-size:14px;padding:16px 0;margin-top:12px;border-bottom:1px solid var(--line)}
.submitLock{color:var(--ink)}.issueLine{display:flex;align-items:center;justify-content:space-between;gap:12px}.issueLine b{font-weight:500}.issue.green{color:var(--accent)}
.reviewFoot{margin-top:24px}.successState{padding:16px 0;text-align:center}.successState h2{font-size:24px}
.doneMark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto;background:var(--selected);border-radius:50%;color:var(--accent);font-size:24px}
.resultBox{white-space:pre-wrap;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;font-size:14px;margin-top:24px;overflow-wrap:anywhere}
.tiny{font-size:12px;color:var(--muted);margin-top:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 40px);width:max-content;background:var(--ink);color:white;border-radius:var(--radius);padding:12px 16px;font-size:14px;opacity:0;pointer-events:none;z-index:10}.toast.show{opacity:1}
/* Optional paths share quiet, accessible disclosure controls. */
.textAction,.disclosure summary{min-height:44px;padding:10px 0;color:var(--accent);font-size:14px;cursor:pointer}
.textAction{display:block;border:0;background:transparent;margin-top:12px}
.disclosure{margin-top:8px}
.disclosure summary{width:fit-content;max-width:100%}
.disclosure summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.disclosure .field{margin-top:8px}
.disclosure[open] .field{animation:disclosure-in .16s ease-out}
.thumbnail{width:56px;height:56px;flex:0 0 56px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--selected);font-size:10px}
@keyframes disclosure-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.disclosure[open] .field{animation:none}}
@media(min-width:600px){.cityGrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}

</style>

  <script>
/* Shared locale runtime. Dictionaries load before the questionnaire. */
const I18N={};
const LOCALE_STORAGE='cq-trip-web-v4-locale';
function browserLocale(language){
  const value=(language||'').toLowerCase();
  if(/^zh-(tw|hk|mo|hant)(-|$)/.test(value))return 'zh-TW';
  if(value==='zh'||/^zh-(cn|sg|hans)(-|$)/.test(value))return 'zh-CN';
  return 'en';
}
let locale;
try{locale=localStorage.getItem(LOCALE_STORAGE)}catch{}
if(!['zh-CN','zh-TW','en'].includes(locale))locale=browserLocale(navigator.language);
try{localStorage.setItem(LOCALE_STORAGE,locale)}catch{}
function tr(key,params={}){
  const value=I18N[locale]?.[key];
  if(value===undefined)throw new Error('Missing translation: '+locale+' / '+key);
  return value.replace(/\{(\w+)\}/g,(_,name)=>{
    if(params[name]===undefined)throw new Error('Missing translation parameter: '+key+' / '+name);
    return String(params[name]);
  });
}
function cityLabel(value){return value?(I18N[locale]['city.'+value]||value):tr('common.unfilled')}
function placeLabel(value){return I18N[locale]['place.'+value]||value}
function placeKey(value){
  for(const key of Object.keys(I18N['zh-CN']).filter(key=>key.startsWith('place.'))){
    if(Object.values(I18N).some(dict=>dict[key]===value))return key.slice(6);
  }
  return value;
}
function formatDate(iso){
  if(!iso)return tr('common.unfilled');
  return new Intl.DateTimeFormat(locale,{year:'numeric',month:locale==='en'?'short':'long',day:'numeric'}).format(new Date(iso+'T00:00:00'));
}
const INTEREST_KEYS={nature:1,citywalk:1,museum:1,shopping:1,photo:1,night:1,food:1};
function localizeShell(){
  document.documentElement.lang=locale;
  document.title=tr('app.document_title');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-label]').forEach(el=>el.setAttribute('aria-label',tr(el.dataset.i18nLabel)));
  document.querySelectorAll('[data-locale]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.locale===locale));
}
function switchLocale(nextLocale){
  if(!I18N[nextLocale]||nextLocale===locale)return;
  const y=window.scrollY;
  locale=nextLocale;
  try{localStorage.setItem(LOCALE_STORAGE,locale)}catch{}
  document.getElementById('toast').classList.remove('show');
  if(successVisible)finish();else render();
  window.scrollTo({top:y,behavior:'instant'});
}
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-locale]');
  if(button)switchLocale(button.dataset.locale);
});

</script>

// Thumbnail URLs belong to the current render, never to persisted draft data.
let thumbnailGeneration=0;
const thumbnailURLs=[];
function clearThumbnails(){
  thumbnailGeneration++;
  thumbnailURLs.splice(0).forEach(url=>URL.revokeObjectURL(url));
}
async function showThumbnails(root,readFiles){
  const generation=thumbnailGeneration;
  const images=[...root.querySelectorAll('[data-thumbnail]')];
  if(!images.length)return;
  try{
    const files=await readFiles();
    if(generation!==thumbnailGeneration)return;
    images.forEach(image=>{
      const file=files.find(file=>file.id===image.dataset.thumbnail);
      if(!file?.blob)return;
      const url=URL.createObjectURL(file.blob);thumbnailURLs.push(url);image.src=url;
    });
  }catch(error){/* Metadata and delete controls remain usable if previews fail. */}
}

}

function pageIssues(id){
  const a=[];const add=m=>a.push(m);
  if(id==='origin'&&!P.trip.origin)add(tr('validation.origin_required'));
  if(id==='dates'&&(!P.trip.start_date||!P.trip.end_date))add(tr('validation.complete_your_travel_dates'));
  if(id==='party_type'&&!P.party.type)add(tr('validation.choose_who_you_are_traveling_with'));
  if(id==='party_details'){
    if(!Number.isInteger(Number(P.party.size))||Number(P.party.size)<2)add(tr('validation.enter_the_exact_number_of_travelers'));
    if(P.party.type==='family'&&!P.party.family_members.length)add(tr('validation.choose_who_is_in_your_family_group'));
    if(P.party.type==='family'&&P.party.family_members.includes('child')&&!P.party.child_ages.trim())add(tr('validation.enter_the_children_s_ages'));
  }
  if(id==='known'&&!P.answered.known)add(tr('validation.confirm_what_you_have_already_booked_or_decided'));
  if(id==='materials'){
    const ok=cat=>{
      if(cat==='hotel')return P.attachments.hotel.length>0||P.hotel.manual_note.trim();
      if(cat==='inbound')return P.attachments.inbound.length>0||P.transport.inbound_manual.trim();
      if(cat==='outbound')return P.attachments.outbound.length>0||P.transport.outbound_manual.trim();
      if(cat==='event')return P.attachments.event.length>0||P.event.manual_note.trim();
      return true;
    };
    if(P.known.hotel&&!isDayTrip()&&!ok('hotel'))add(tr('validation.upload_a_hotel_screenshot_or_enter_the_details'));
    if(P.known.hotel&&!isDayTrip()&&!['all','partial'].includes(P.hotel.coverage))add(tr('validation.confirm_whether_your_hotel_bookings_cover_all_nights'));
    if(P.known.inbound&&!ok('inbound'))add(tr('validation.upload_your_travel_to_chongqing_booking_or_enter'));
    if(P.known.outbound&&!ok('outbound'))add(tr('validation.upload_your_travel_from_chongqing_booking_or_enter'));
    if(P.known.fixed_event&&!ok('event'))add(tr('validation.upload_your_fixed_plans_or_enter_the_details'));
  }
  if(id==='travel_bounds'){
    if(!P.known.inbound&&!P.trip.first_day_window)add(tr('validation.choose_when_you_can_start_on_the_first'));
    if(!P.known.outbound&&!P.trip.last_day_window)add(tr('validation.choose_when_you_need_to_finish_on_the'));
  }
  if(id==='places'&&selectedPlaceNames().length===0)add(tr('validation.add_the_places_you_want_to_visit'));
  if(id==='must_places'&&(!P.answered.must_places||P.places.must.some(n=>!selectedPlaceNames().includes(n))))add(tr('validation.confirm_your_must_visits_from_your_current_wanted'));
  if(id==='stay_style'&&!stayOptions().some(([,v])=>v===P.hotel.stay_style))add(tr('validation.choose_a_room_arrangement_for_your_group'));
  if(id==='hotel_budget'&&!P.hotel.budget_per_room)add(tr('validation.choose_your_hotel_budget_per_room_per_night'));
  if(id==='driving'&&!P.driving.mode)add(tr('validation.confirm_whether_you_will_drive_or_rent_a'));
  if(id==='day_start'){
    if(!P.schedule.usual_start)add(tr('validation.choose_your_usual_start_time'));
    if(!P.schedule.earliest_start)add(tr('validation.choose_your_earliest_possible_start_time'));
  }
  if(id==='day_end'){
    if(!P.schedule.usual_return)add(tr('validation.choose_your_usual_return_time'));
    if(!P.schedule.latest_return)add(tr('validation.choose_your_latest_possible_return_time'));
  }
  if(id==='mobility'){
    if(!P.mobility.usual_steps)add(tr('validation.choose_a_comfortable_daily_step_count'));
    if(!P.mobility.hard_steps)add(tr('validation.choose_your_maximum_step_count_for_a_busy'));
    if(!P.mobility.stairs)add(tr('validation.choose_your_comfort_level_with_hills_and_stairs'));
  }
  if(id==='taxi'&&P.local_transport.taxi_cap===undefined)add(tr('validation.choose_how_much_extra_your_group_would_pay'));
  if(id==='food_budget'){
    if(!P.food.meal_budget)add(tr('validation.choose_your_usual_meal_budget'));
    if(P.food.meal_max===undefined)add(tr('validation.choose_your_maximum_budget_for_a_special_meal'));
  }
  if(id==='food_rules'){
    if(!P.food.queue)add(tr('validation.choose_your_maximum_waiting_time'));
    if(!P.answered.dietary)add(tr('validation.confirm_your_dietary_restrictions'));
    if(!P.food.smoke_rule)add(tr('validation.choose_your_smoking_environment_preference'));
  }
  if(id==='interests'&&['nature','citywalk','museum','shopping','photo','night','food'].some(k=>!P.interests[k]))add(tr('validation.rate_all_the_activities'));
  if(id==='hard_rules'&&!P.answered.hard_rules)add(tr('validation.confirm_any_other_requirements'));
  return a;
}
function complete(id){return id==='review'?validate().length===0:pageIssues(id).length===0}
function validate(){
  const out=[];
  for(const s of steps()){
    if(s.id==='review')continue;
    for(const msg of pageIssues(s.id))out.push({id:s.id,msg});
  }
  return out;
}

function render(){
  successVisible=false;localizeShell();clearThumbnails();
  const [S,i]=stepIndex(),q=S[i];
  const required=S.filter(s=>s.id!=='review');
  const done=required.filter(s=>complete(s.id)).length;
  const pct=Math.round(done/required.length*100);
  document.getElementById('score').textContent=pct+'%';
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('progress').setAttribute('aria-valuenow',pct);
  renderStageNav();renderQuestionNav();
  card.innerHTML=QuestionTitle(q,i,S.length)+`<div class="answerArea">${content(q.id)}</div>`;
  enhanceControls(card);
  showThumbnails(card,idbAll);
  bottom.style.display=q.id==='review'?'none':'grid';
  back.disabled=i===0;
  next.disabled=!complete(q.id);
  wire(q.id);save();
}

function rerender(){render()}
function updateNext(){next.disabled=!complete(currentId);save()}

  if(!fullTimeDriving())transport.push(row('taxi',P.local_transport.taxi_cap==='open'?tr('common.unlimited'):P.local_transport.taxi_cap===undefined?tr('common.unfilled'):'¥'+P.local_transport.taxi_cap));
  const food=[row('meal',valLabel(P.food.meal_budget)+tr('unit.per_person')),row('max_meal',P.food.meal_max==='open'?tr('common.unlimited'):P.food.meal_max===undefined?tr('common.unfilled'):'¥'+P.food.meal_max+tr('unit.per_person')),row('queue',P.food.queue==='open'?tr('queue.open'):P.food.queue===''?tr('common.unfilled'):tr('unit.minutes',{n:P.food.queue})),row('diet',list(P.food.dietary,'diet')),row('smoking',valLabel(P.food.smoke_rule))];
  if(P.food.dietary.includes('other')&&P.food.dietary_other)food.push(row('note',P.food.dietary_other));

async function buildZip(){
  const zip=new JSZip();
  const exportP=JSON.parse(JSON.stringify(P));
  exportP.locale=locale;exportP.submitted=true;exportP.exported_at=new Date().toISOString();
  zip.file('travel_order.json',JSON.stringify(exportP,null,2));
  zip.file('travel_request.txt',buildText());
  zip.file('README.txt',tr('export.chongqing_trip_request_package_read_travel_order_json'));
  const active={hotel:P.known.hotel&&!isDayTrip(),inbound:P.known.inbound,outbound:P.known.outbound,event:P.known.fixed_event};
  for(const r of await idbAll()){
    if(!active[r.category])continue;
    const safe=(r.name||'attachment').replace(/[\/:*?\x22<>|]/g,'_');
    zip.file(`attachments/${r.category}/${r.id}_${safe}`,r.blob);
  }
  return await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
}

    <button class="secondary" id="downloadPack">${esc(tr('success.download_trip_details'))}</button>
    <button class="secondary" id="copyText">${esc(tr('success.copy_text'))}</button>
    <details class="disclosure"><summary>${esc(tr('success.view_trip_details'))}</summary><div class="resultBox">${esc(text)}</div></details>
    <div class="tiny">${esc(tr('success.saved_only_in_this_browser_nothing_has_been'))}</div></div>`;
  bottom.style.display='none';
  const makeFile=async()=>new File([await buildZip()],`${esc(tr('success.chongqing_trip'))}${P.order_id.slice(0,8)}.zip`,{type:'application/zip'});
  document.getElementById('downloadPack').onclick=async()=>{toast(tr('success.preparing_your_file'));const f=await makeFile(),u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
  document.getElementById('sharePack').onclick=async()=>{toast(tr('success.preparing_your_file'));const f=await makeFile();if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({title:tr('success.chongqing_trip_details'),files:[f]});return}catch(e){}}const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast(tr('success.file_sharing_is_not_supported_here_downloading_instead'))};
  document.getElementById('copyText').onclick=async()=>{await navigator.clipboard.writeText(text);toast(tr('success.copied'))};
}

// IndexedDB attachment store
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbPut(category,file){
  const db=await dbOpen(),id=(crypto.randomUUID?crypto.randomUUID():'f-'+Date.now()+'-'+Math.random());
  const rec={id,category,name:file.name,size:file.size,type:file.type,blob:file};
  await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();return rec;
}
async function idbDelete(id){const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
async function idbAll(){const db=await dbOpen();const rows=await new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});db.close();return rows}
async function idbClear(){const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}

render();


</script>
