<main class="app-shell">
<section id="landing" class="screen landing-screen">
<div class="eyebrow">工作决策测试 · 完整版</div>
<h1>这份工作，<br>还值得再待一年吗？</h1>
<p class="lead">不只看工资。我们会把你的<strong>当前回报、未来增值、可持续性和离开能力</strong>拆开看，再结合你真正想改善的事情、值得等的节点和现实风险。</p>
<div class="feature-grid">
<div class="feature"><b>约 7–10 分钟</b><span>按收入和工作类型自动换题</span></div>
<div class="feature"><b>4 个维度</b><span>不压成一个笼统总分</span></div>
<div class="feature"><b>16 种阶段</b><span>给判断依据，不替你做决定</span></div>
</div>
<div class="privacy-note">答题进度会保存在当前浏览器；生成结果时，答案会发送到计算服务进行分析。当前不建立用户数据库。</div>
<button id="startBtn" class="primary-btn">开始测试</button>
<button id="resumeBtn" class="ghost-btn hidden">继续上次测试</button>
</section>

<section id="quiz" class="screen hidden">
<header class="quiz-header">
<button id="backBtn" class="icon-btn" aria-label="上一题">←</button>
<div class="progress-wrap"><div class="progress-meta"><span id="progressLabel"></span><span id="progressText"></span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div>
</header>
<div id="questionCard" class="question-card"></div>
<div class="quiz-actions"><button id="nextBtn" class="primary-btn" disabled>下一题</button></div>
</section>

<section id="result" class="screen hidden">
<div id="resultContent"></div>
<div class="result-actions"><button id="shareCardBtn" class="primary-btn">生成分享图</button><button id="copyBtn" class="ghost-btn">复制结果摘要</button><button id="restartBtn" class="ghost-btn">重新测试</button></div>
</section>
</main>
<div id="toast" class="toast hidden"></div>

function q11Title(){var base=["commission","project"].indexOf(state.answers.q2)>=0?"先不算特别高或特别低的偶发月份，和之前相比，你现在大多数月份通常能拿到的收入变化了多少？":"和之前相比，你现在每月比较稳定能拿到的收入变化了多少？";return isShortTenure()?base.replace("和之前相比","和刚进入目前岗位时相比"):base.replace("和之前相比","和大约一年前相比");}
function q4Title(){var t=state.answers.q2;if(t==="commission")return "过去6个月，你平均每月实际拿到的总收入大约是多少？";if(t==="hourly")return "过去3个月，你平均每月实际拿到的收入大约是多少？";if(t==="project")return "过去6个月，你平均每月实际收到的项目或客户收入大约是多少？";return "每月比较稳定能拿到多少收入？";}

function q13Title(){return isShortTenure()?"进入目前岗位以来，你完成了多少项以后换工作时也值得讲的完整工作成果？":"过去12个月，你完成了多少项以后换工作时也值得讲的完整工作成果？";}
function q14Title(){return isShortTenure()?"进入目前岗位以来，你有没有能比较清楚证明自己工作价值的结果？":"过去12个月，你有没有能比较清楚证明自己工作价值的结果？";}
function q15Title(){return isShortTenure()?"进入目前岗位以来，你承担工作的责任和影响范围发生了多大变化？":"和大约一年前相比，你现在承担工作的责任和影响范围发生了多大变化？";}
function q13Help(){return (workExamples[state.answers.q1]||workExamples.other).out+" 一项完整成果最好能说清：背景、你负责什么、最后交付了什么。";}
function q14Help(){return (workExamples[state.answers.q1]||workExamples.other).proof+" 不一定必须是数字，但要能说明你的贡献和最后发生的变化。";}
function q22Title(){return state.answers.q2==="project"?"过去6个月，你对新的客户或项目机会验证到哪一步？":"过去6个月，你对外部工作机会验证到哪一步？";}
function q25Options(){var a=[
 opt("pay","工资 / 奖金 / 报销出现拖欠"),
 opt("layoff","频繁裁员 / 缩编 / 冻结招聘"),
 opt("shrink","核心业务 / 订单 / 项目明显收缩"),
 opt("role","我的岗位可能被取消、合并、外包或缩减"),

];if(state.answers.q2==="project"){a.push(opt("clientEnd","主要客户 / 订单来源明显减少或即将结束"));a.push(opt("concentration","收入高度依赖单一客户，后续合作不确定"));}a.push(opt("none","没有明显风险"));a.push(opt("unknown","不清楚"));return a;}

var questions=[
{id:"q1",section:"基础信息",title:"你现在主要做哪类工作？",help:"选最接近你日常核心工作的那一类。",type:"single",options:function(){return Object.keys(workTypes).map(function(k){return opt(k,workTypes[k]);});}},
{id:"q2",section:"基础信息",title:"你的收入主要怎么计算？",type:"single",options:function(){return [opt("fixed","固定月薪为主"),opt("bonus","固定工资 + 较明显奖金 / 绩效"),opt("commission","底薪 + 提成 / 佣金"),opt("hourly","按工时 / 班次计薪"),opt("project","按项目 / 订单 / 客户结算")];}},

{id:"q4",section:"当前回报",title:q4Title,help:"优先按实际拿到手、你自己最熟悉的口径来选；后面会单独比较市场位置。",type:"single",options:function(){return [opt("lt5","5000元以下"),opt("5to8","5000–8000元"),opt("8to12","8000–1.2万元"),opt("12to20","1.2–2万元"),opt("20to30","2–3万元"),opt("30to50","3–5万元"),opt("50plus","5万元以上")];}},
{id:"q6",section:"当前回报",title:q6Title,help:"尽量参考最近的真实岗位、猎头沟通、面试、offer或同行信息。不知道就直接选“不清楚”。",type:"single",options:function(){return [opt("low20","明显偏低，约低20%以上"),opt("low10","略低，约低10%–20%"),opt("same","大致相当，约±10%"),opt("high10","略高，约高10%–20%"),opt("high20","明显偏高，高20%以上"),opt("unknown","不清楚 / 最近没认真比较")];}},

function getQ(id){for(var i=0;i<questions.length;i++)if(questions[i].id===id)return questions[i];return null;}
function titleOf(q){return typeof q.title==="function"?q.title(state.answers):q.title;}
function helpOf(q){return typeof q.help==="function"?q.help(state.answers):q.help;}
function optionsOf(q){return typeof q.options==="function"?q.options(state.answers):q.options;}
function visibleQuestions(){return questions.filter(function(q){return !q.showIf||q.showIf(state.answers);});}
function optionObj(id,value){var q=getQ(id);if(!q)return null;var o=optionsOf(q);for(var i=0;i<o.length;i++)if(o[i].value===value)return o[i];return null;}
function label(id){var a=state.answers[id];if(Array.isArray(a))return a.map(function(v){var o=optionObj(id,v);return o?o.label:v;}).join("、");var x=optionObj(id,a);return x?x.label:"";}
function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];});}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(STORAGE));if(s&&s.answers&&s.currentId)state=s;}catch(e){}}
function clearSaved(){try{localStorage.removeItem(STORAGE);}catch(e){}}
function show(screen){[landing,quiz,result].forEach(function(x){x.classList.add("hidden");});screen.classList.remove("hidden");window.scrollTo(0,0);}

function hasAnswer(q){var a=state.answers[q.id];return q.type==="multi"?Array.isArray(a)&&a.length>0:a!==undefined&&a!==null&&a!=="";}
function choose(q,value){
 cancelAutoAdvance();
 var before=JSON.stringify(state.answers[q.id]);
 if(q.type==="multi"){
   var arr=Array.isArray(state.answers[q.id])?state.answers[q.id].slice():[];
   var exclusive=q.exclusive||[];
   if(exclusive.indexOf(value)>=0){arr=arr.indexOf(value)>=0?[]:[value];}
   else{arr=arr.filter(function(x){return exclusive.indexOf(x)<0;});arr=arr.indexOf(value)>=0?arr.filter(function(x){return x!==value;}):arr.concat([value]);}
   state.answers[q.id]=arr;
 }else state.answers[q.id]=value;
 var changed=before!==JSON.stringify(state.answers[q.id]);
 if(changed){
   var qi=questions.findIndex(function(x){return x.id===q.id;});
   for(var i=qi+1;i<questions.length;i++)delete state.answers[questions[i].id];
 }
 renderQuestion(true);
 if(!changed)return;
 var exclusiveSelected=q.type==="multi"&&(q.exclusive||[]).indexOf(value)>=0&&Array.isArray(state.answers[q.id])&&state.answers[q.id].length===1&&state.answers[q.id][0]===value;
 if(q.type!=="multi"||exclusiveSelected){
   autoAdvanceTimer=setTimeout(function(){
     autoAdvanceTimer=null;
     if(state.currentId!==q.id)return;
     var a=state.answers[q.id];
     var stillSelected=q.type==="multi"?(Array.isArray(a)&&a.length===1&&a[0]===value):a===value;
     if(stillSelected)goNext();
   },320);
 }
}
function renderQuestion(preserveScroll){
 var keepY=preserveScroll?window.scrollY:null;
 if(quiz.classList.contains("hidden"))show(quiz);
 else if(!preserveScroll)window.scrollTo(0,0);
 var q=getQ(state.currentId);if(!q){finish();return;}
 var visible=visibleQuestions(),idx=visible.findIndex(function(x){return x.id===q.id;});
 if(idx<0){state.currentId=visible[0].id;q=getQ(state.currentId);idx=0;}
 progressBar.style.width=Math.max(4,((idx+1)/visible.length)*100)+"%";
 progressLabel.textContent=(idx+1)+" / "+visible.length;progressText.textContent=q.section;
 backBtn.style.visibility=state.path.length?"visible":"hidden";
 var answer=state.answers[q.id],multi=q.type==="multi",html='<div class="q-kicker">'+escapeHtml(q.section)+'</div><h2 class="q-title">'+escapeHtml(titleOf(q))+'</h2>';
 var h=helpOf(q);if(h)html+='<p class="q-help">'+escapeHtml(h)+'</p>';if(multi)html+='<p class="multi-note">可多选，选完点继续</p>';html+='<div class="options">';
 optionsOf(q).forEach(function(o){var selected=multi?(Array.isArray(answer)&&answer.indexOf(o.value)>=0):answer===o.value;html+='<button class="option '+(multi?"checkbox ":"")+(selected?"selected":"")+'" data-value="'+escapeHtml(o.value)+'"><span class="option-dot">'+(selected?"✓":"")+'</span><span>'+escapeHtml(o.label)+'</span></button>';});
 html+="</div>";card.innerHTML=html;card.querySelectorAll(".option").forEach(function(btn){btn.addEventListener("click",function(){choose(q,btn.dataset.value);});});
 if(multi){quizActions.classList.remove("hidden");nextBtn.disabled=!hasAnswer(q);nextBtn.textContent=idx===visible.length-1?"查看结果":"选好了，继续";}else{quizActions.classList.add("hidden");nextBtn.disabled=false;}save();
 if(preserveScroll&&keepY!==null)requestAnimationFrame(function(){window.scrollTo(0,keepY);});
}
function goNext(){cancelAutoAdvance();var q=getQ(state.currentId);if(!q||!hasAnswer(q))return;var visible=visibleQuestions(),idx=visible.findIndex(function(x){return x.id===q.id;});if(idx===visible.length-1){finish();return;}state.path.push(q.id);state.currentId=visible[idx+1].id;save();renderQuestion();}
function goBack(){cancelAutoAdvance();if(!state.path.length)return;state.currentId=state.path.pop();save();renderQuestion();}


var API_BASE="https://work-worth-test-api-production.up.railway.app";
var dimNames={reward:"当前回报",growth:"未来增值",sustainability:"可持续性",exit:"离开能力"};

async function requestResult(){
 var controller=new AbortController();
 var timer=setTimeout(function(){controller.abort();},15000);
 try{
  var res=await fetch(API_BASE+"/evaluate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   credentials:"omit",
   signal:controller.signal,
   body:JSON.stringify({answers:state.answers})
  });
  var data=null;
  try{data=await res.json();}catch(e){}
  if(!res.ok)throw new Error((data&&data.error)||("HTTP_"+res.status));
  if(!data||!data.scores||!data.stage||!data.dimensions||!data.content)throw new Error("INVALID_API_RESPONSE");
  return data;
 }finally{clearTimeout(timer);}
}

function renderApiResult(data){
 var s=data.scores,stage=data.stage,c=data.content||{},risk=data.risk||{level:"none"},waiting=data.waiting||{level:"none"};
 var reasons=c.reasons||{},notes=c.confidence_notes||[];
 var highRisk=risk.level==="high";
 var heroTitle=highRisk?"先处理现实风险":(stage.display_name||stage.name);
 var html='<section class="result-hero"><div class="result-label">你的结果</div><h1 class="stage-title">'+escapeHtml(heroTitle)+'</h1>';
 if(highRisk){
  html+='<p class="stage-summary"><strong>如果暂时不考虑这项结构性风险，你的基础工作状态更接近「'+escapeHtml(stage.name)+'」。</strong></p>';
  if(c.risk)html+='<div class="risk-note">'+escapeHtml(c.risk)+'</div>';
 }else{
  if(stage.observe)html+='<p class="stage-summary"><strong>根据目前有限信息，你暂时更接近「'+escapeHtml(stage.name)+'」</strong></p>';
  else html+='<p class="stage-summary"><strong>'+escapeHtml(stage.labels||"")+'</strong></p>';
  html+='<p class="stage-summary">'+escapeHtml(c.intro||"")+'</p>';
 }
 if(c.workplace)html+='<div class="'+((data.workplace&&data.workplace.level==="high")?"risk-note":"info-note")+'">'+escapeHtml(c.workplace)+'</div>';

 if(stage.adjacent){
  var adj=stage.adjacent,bn;
  if(adj.count>=2)bn="你有多个维度都靠近分界，目前更像一个过渡状态。最近的相邻阶段是「"+adj.stage+"」。";

 if(notes.length)html+='<div class="info-note">'+escapeHtml(notes.join(" "))+'</div>';

 ["reward","growth","sustainability","exit"].forEach(function(k){

 });

 html+='<section class="section-card"><h2>为什么会落在这里</h2>';

 if(c.risk||c.waiting){

 }

 html+='<section class="section-card"><h2>如果再待半年到一年</h2><p>'+escapeHtml(c.future_good||"")+'</p><p>'+escapeHtml(c.future_warning||"")+'</p></section>';
 html+='<section class="section-card"><h2>下一步先做一件事</h2><p><strong>'+escapeHtml(c.main_action||"")+'</strong></p>';

 result.dataset.stage=highRisk?"先处理现实风险":(stage.observe?"观察期（接近"+stage.name+"）":stage.name);

function roundRect(ctx,x,y,w,h,r,fill,stroke){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
 if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
}
function fitText(ctx,text,maxWidth,startSize,minSize,weight){
 var size=startSize;ctx.font=(weight||700)+" "+size+"px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";
 while(size>minSize&&ctx.measureText(text).width>maxWidth){size-=1;ctx.font=(weight||700)+" "+size+"px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";}
 return size;
}
function drawQrFallback(ctx,x,y,size){
 roundRect(ctx,x,y,size,size,18,"#ffffff","#ded8ce");
 ctx.fillStyle="#69716c";ctx.textAlign="center";ctx.font="600 22px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";
 ctx.fillText("扫码测试",x+size/2,y+size/2-4);
 ctx.font="400 17px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";
 ctx.fillText("网址见下方",x+size/2,y+size/2+28);
}
function loadQrLibrary(){
 if(window.QRCode)return Promise.resolve(true);
 return new Promise(function(resolve){
  var existing=document.querySelector('script[data-qrcode-lib]');
  if(existing){existing.addEventListener("load",function(){resolve(!!window.QRCode);},{once:true});existing.addEventListener("error",function(){resolve(false);},{once:true});return;}
  var sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";sc.async=true;sc.dataset.qrcodeLib="1";
  sc.onload=function(){resolve(!!window.QRCode);};sc.onerror=function(){resolve(false);};document.head.appendChild(sc);
 });
}
async function makeQrCanvas(size){
 var ok=await loadQrLibrary();if(!ok)return null;
 var box=document.createElement("div");box.style.position="fixed";box.style.left="-9999px";box.style.top="-9999px";document.body.appendChild(box);
 try{
  new QRCode(box,{text:SHARE_URL,width:size,height:size,colorDark:"#202522",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  await new Promise(function(r){setTimeout(r,40);});
  var c=box.querySelector("canvas");
  if(c)return c;
  var img=box.querySelector("img");
  if(img){if(!img.complete)await new Promise(function(r){img.onload=r;img.onerror=r;});var tmp=document.createElement("canvas");tmp.width=size;tmp.height=size;tmp.getContext("2d").drawImage(img,0,0,size,size);return tmp;}
  return null;
 }catch(e){console.warn("QR generation failed",e);return null;}
 finally{box.remove();}
}

 });

 ctx.textAlign="left";ctx.fillStyle="#202522";ctx.font="700 25px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";ctx.fillText("这只是你现在的工作状态，不是长期标签。",96,826);
 ctx.fillStyle="#69716c";ctx.font="400 20px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";ctx.fillText("扫码测测你的工作，也看看四个维度分别是什么样。",96,866);

 else drawQrFallback(ctx,96,920,214);

 ctx.textAlign="left";ctx.fillStyle="#202522";ctx.font="700 21px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";ctx.fillText("扫码测测你的工作",342,974);
 ctx.fillStyle="#69716c";ctx.font="400 17px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";ctx.fillText("yuele-he.github.io/travel-plan/",342,1021);ctx.fillText("work-worth-test/",342,1049);
 ctx.fillStyle="#8a918d";ctx.font="400 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";ctx.fillText("结果用于帮助梳理现状，不替你做决定。",342,1102);

 return new Promise(function(resolve){canvas.toBlob(function(blob){resolve(blob);},"image/png",.95);});
