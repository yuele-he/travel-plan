<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="referrer" content="no-referrer">
  <title>旅行攻略</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="eyebrow">FINAL GUIDE</div>
      <h1 id="tripTitle">旅行攻略</h1>
      <div class="sub" id="tripMeta">正在加载…</div>
    </header>

    <div id="statusBanner" class="banner hidden"></div>

    <nav class="nav-wrap" aria-label="攻略页面">
      <div class="nav">
        <button class="active" data-view="today">今天</button>
        <button data-view="all">全部行程</button>
        <button data-view="tasks">行程待办</button>
      </div>
    </nav>

    <main>
      <section id="today" class="view active"></section>
      <section id="all" class="view"></section>
      <section id="tasks" class="view"></section>
    </main>

    <footer>
      客户端只负责展示。规划规则、研究数据、客户原始资料和密钥不会放在公开仓库中。
    </footer>
  </div>

  <script src="./config.js"></script>
  <script defer src="https://static.cloudbase.net/cloudbase-js-sdk/3.0.1/cloudbase.full.js"></script>
  <script defer src="./cloudbase-client.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
